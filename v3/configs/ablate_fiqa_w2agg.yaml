# Segmentation/aggregation ablation: is the granularity effect tied to one
# particular splitting scheme? (4 aggregations evaluated per run)
name: ablate_fiqa_w2agg
datasets: [fiqa]
data_dir: null
n_docs: 2000
n_queries: 200
seed: 42
split: test
top_k: 100
aggregations: [max, topk_mean, weighted_topk, softmax_weighted]
agg_k: 3

encoder:
  name: dense
  model: intfloat/e5-base-v2
  batch_size: 64

segmentation:
  mode: sentence_window
  window: 2
  stride: 1
  min_words: 5

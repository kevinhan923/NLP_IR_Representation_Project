name: controlled_arguana_tfidf
datasets: [arguana]
data_dir: null
n_docs: 2000
n_queries: 200
seed: 42
split: test
top_k: 100
aggregations: [max, topk_mean]
agg_k: 3
encoder:
  name: tfidf_projection
  r: 192
  max_features: 50000
  seed: 42
segmentation:
  mode: sentence_window
  window: 2
  stride: 1
  min_words: 5

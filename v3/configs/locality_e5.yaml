# M2: evidence locality vs per-query granularity delta, E5 encoder.
# Same pools/seed as the M1 controlled runs so per-dataset aggregates must
# reproduce the M1 numbers (built-in sanity check). All 6 datasets, so the
# correlation sees both penalized (fiqa, scidocs) and unaffected (scifact,
# nfcorpus) regimes; trec-covid/touche are ceiling-limited but kept for
# completeness.
name: locality_e5
datasets: [scifact, nfcorpus, fiqa, scidocs, trec-covid, webis-touche2020]
data_dir: null
n_docs: 2000
n_queries: 200
seed: 42
split: test
top_k: 100
aggregations: [max, topk_mean]
agg_k: 3

encoder:
  name: dense
  model: intfloat/e5-base-v2
  batch_size: 64

# Independent encoder for the circularity check: locality features are ALSO
# computed with MiniLM (x_-prefixed). If they still predict the E5 delta, the
# correlation is not a mechanical artifact of reusing E5's own scores.
locality_encoder:
  name: dense
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64

segmentation:
  mode: sentence_window
  window: 2
  stride: 1
  min_words: 5
